[task]
name = "lightningrod-evals/proactive-execution"
description = "Agent should run notebooks itself instead of asking users to run cells and copy-paste output"
keywords = ["notebook", "execution", "proactive", "run", "cells"]

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"

[environment]
allow_internet = true
memory_mb = 4096

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"
