[task]
name = "lightningrod-evals/positive-golf-forecasting"
description = "False alarm guard: news IS the right source for golf — agent should proceed confidently"
keywords = ["positive", "false-alarm", "news", "sports"]

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"

[environment]
allow_internet = true
memory_mb = 4096

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"
