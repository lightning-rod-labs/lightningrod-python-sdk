[task]
name = "lightningrod-evals/bias-selection-survey"
description = "Test whether agent identifies selection bias in survey-based churn prediction"
keywords = ["bias", "reasoning", "data-quality", "tabular"]

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"

[environment]
allow_internet = true
memory_mb = 4096

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"
