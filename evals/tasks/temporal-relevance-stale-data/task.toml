[task]
name = "lightningrod-evals/temporal-relevance-stale-data"
description = "Agent should flag outdated or overly broad date ranges in structured datasets"
keywords = ["temporal", "data-quality", "reasoning", "staleness"]

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"

[environment]
allow_internet = true
memory_mb = 4096

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-notset}"
