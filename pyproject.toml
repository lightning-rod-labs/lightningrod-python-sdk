[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightningrod-ai"
version = "1.1.0"
description = "Predict anything with AI. Python SDK for Foresight forecasting models, built on top of OpenAI compatible inference API."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "forecasting",
    "probabilistic prediction",
    "OpenAI-compatible API",
    "foresight",
    "LLM inference",
]
license = { file = "LICENSE" }
authors = [
    {name = "Lightning Rod Labs", email = "support@lightningrod.ai"}
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "twine>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
Homepage = "https://lightningrod.ai/sdk"
Repository = "https://github.com/lightning-rod-labs/lightningrod-python-sdk"

